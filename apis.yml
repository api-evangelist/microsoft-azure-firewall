aid: microsoft-azure-firewall
name: Azure Firewall
description: >-
  Azure Firewall is a managed cloud-based network security service that protects your Azure Virtual Network resources.
  The REST API supports configuring network rules, application rules, NAT rules, and DNS proxy settings, with built-in
  high availability, unrestricted cloud scalability, and threat intelligence-based filtering.
